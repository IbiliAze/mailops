stages:
  - deploy

# Production is built on the shared Swarm manager. Local development stays on
# developer machines (`yarn db:up && yarn dev`).
deploy:prod:
  stage: deploy
  tags:
    - app-primary
  only:
    - main
  script:
    # A per-pipeline image tag makes env-only pipeline reruns roll the stack too.
    - export TAG="$CI_PIPELINE_ID"

    # PROD_ENV is one protected multi-line GitLab variable based on
    # .env.example. The image stays on this host and is not pushed externally.
    - test -n "$PROD_ENV" || { echo "PROD_ENV CI/CD variable is not set"; exit 1; }
    - printf '%s\n' "$PROD_ENV" > .env

    - docker build -t mailops:$TAG .
    - docker stack deploy --resolve-image never -c deploy/docker/docker-compose.prod.yml mailops

    # The shared reverse proxy uses the same wildcard certificate and config
    # directory as JobOps. The guarded creation is safe across pipelines.
    - |
      sudo mkdir -p /opt/stacks/proxy/ssl
      sudo flock /opt/stacks/proxy/ssl/.lock sh -c '
        [ -f /opt/stacks/proxy/ssl/cert.pem ] || openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout /opt/stacks/proxy/ssl/key.pem \
          -out /opt/stacks/proxy/ssl/cert.pem \
          -subj "/CN=*.eightmile.co.uk" \
          -addext "subjectAltName=DNS:*.eightmile.co.uk,DNS:eightmile.co.uk"
      '
    - sudo cp deploy/nginx/mailops.conf /opt/stacks/proxy/conf.d/
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -t
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -s reload

    - docker images "mailops" --format '{{.Repository}}:{{.Tag}}' | grep -v ":$TAG$" | xargs -r docker rmi -f || true

  after_script:
    - rm -f .env

# Required GitLab CI/CD variable:
#
#   PROD_ENV   protected   Full production env based on .env.example. Set:
#                            NODE_ENV=production
#                            WEB_URL=https://mailops.eightmile.co.uk
#                            DATABASE_URL=postgresql://USER:PASS@haproxy:5432/mailops?schema=public
#                            AUTH_SECRET (openssl rand -base64 48)
#                            ADMIN_USERNAME / ADMIN_PASSWORD
#                            OPENAI_API_KEY / MAIL_ACCOUNTS
#
# GitLab cannot mask a multi-line variable, so mark it Protected. The `mailops`
# role/database must exist before first deploy; TypeORM creates tables, not the
# database itself. PORT is fixed to 5000 by the production compose file.
