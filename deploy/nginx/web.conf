# Internal web container: static Next.js export plus a same-origin API proxy.
server {
    listen 5000;
    server_name _;

    root /app/web/out;
    index index.html;

    # Docker's embedded DNS keeps this valid when Swarm replaces an API task.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream mailops-api:5000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static export routes are emitted as both directories and .html files.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
