# MailOps production stack (Docker Swarm, deployed by .gitlab-ci.yml).
#
#   docker stack deploy --resolve-image never -c this-file mailops
#
# Both services use the same `mailops:$TAG` image. Postgres is external and is
# reached through `haproxy:5432` on db-network. The shared reverse proxy reaches
# only `mailops-web:5000` on monitoring-network.
services:
  mailops-api:
    image: mailops:${TAG:-latest}
    command: ['/usr/local/bin/api-entrypoint.sh']
    environment:
      NODE_ENV: production
      PORT: '5000'
    networks: [monitoring-network, db-network]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      # The scheduler and IMAP poller are in-process, so a second replica would
      # duplicate sync and AI work. Distributed locking is required first.
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s

  mailops-web:
    image: mailops:${TAG:-latest}
    command: ['nginx', '-g', 'daemon off;']
    networks: [monitoring-network]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --tries=1 --spider http://127.0.0.1:5000/ || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 10s

networks:
  monitoring-network: { external: true }
  db-network: { external: true }
